# ============================================================
# LuxenX Admin — installateur Windows INDÉPENDANT de LuxenX.
# Pas de section "publish" : l'admin n'est pas distribué via les
# releases publiques de LuxenX (usage interne de l'exploitant).
# ============================================================
appId: com.luxenx.admin
productName: LuxenX Admin
copyright: Copyright © 2026 LuxenX

directories:
  output: release
  buildResources: installer

# Mises à jour automatiques de l'admin : canal dédié « admin »
# (fichier admin.yml de la release GitHub, séparé de latest.yml de LuxenX).
publish:
  provider: github
  owner: ${env.LUXENX_GITHUB_OWNER}
  repo: ${env.LUXENX_GITHUB_REPO}
  channel: admin

files:
  - electron-dist/**
  - renderer-dist/**
  - package.json

win:
  icon: installer/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: LuxenX-Admin-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LuxenX Admin
  deleteAppDataOnUninstall: false
  license: installer/ACCORD-DONNEES.txt
  artifactName: LuxenX-Admin-Setup-${version}.${ext}
